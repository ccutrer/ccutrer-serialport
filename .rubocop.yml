inherit_gem:
  rubocop-inst:
  - rubocop.yml
  - rubocop-rspec.yml

plugins:
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.1

Naming/FileName:
  Exclude:
    - lib/ccutrer-serialport.rb
RSpec/InstanceVariable:
  Enabled: false
RSpec/SpecFilePathFormat:
  CustomTransform:
    CCutrer: ccutrer
Style/Documentation:
  Enabled: false
Style/SpecialGlobalVars:
  Enabled: false
