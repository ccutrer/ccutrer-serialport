name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true
      - name: Run rubocop
        run: bin/rubocop
  rspec:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ruby-version: [3.1, 3.2, 3.3, 3.4, "4.0"]
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version}}
          bundler-cache: true
      - name: Install socat (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt install -y socat
      - name: Install socat (macOS)
        if: matrix.os == 'macos-latest'
        env:
            HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install socat
      - name: Run rspec
        run: bin/rspec
